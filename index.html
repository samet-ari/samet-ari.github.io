<style>
  :root{
    --bg-deep:#0E1520;
    --bg-card:#141D2B;
    --edge:#243247;
    --ink:#EAF0F6;
    --ink-muted:#8FA0B2;
    --accent:#E0A458;
    --accent-soft:rgba(224,164,88,0.14);
    --status:#59C9A5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    overflow-x:hidden;
  }
  #matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .6s ease-out both;}
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    background:var(--bg-card);
    border:1px solid var(--edge);
    border-radius:18px;
    padding:40px 32px 32px;
    text-align:center;
  }
  .mark{
    width:88px;
    height:88px;
    margin:0 auto 24px;
    display:block;
  }
  .mark polygon{
    fill:var(--accent-soft);
    stroke:var(--accent);
    stroke-width:1.6;
  }
  .mark .inner{
    fill:none;
    stroke:var(--edge);
    stroke-width:1;
  }
  .mark text{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:26px;
    fill:var(--accent);
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:22px;
    letter-spacing:.2px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .title{
    font-size:14.5px;
    color:var(--ink-muted);
    margin:0 0 18px;
    line-height:1.4;
  }
  .status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:12.5px;
    color:var(--ink-muted);
    background:rgba(89,201,165,0.08);
    border:1px solid rgba(89,201,165,0.25);
    border-radius:20px;
    padding:5px 12px 5px 10px;
    margin-bottom:28px;
  }
  .status .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--status);
    flex:none;
  }
  .divider{
    height:1px;
    background:var(--edge);
    margin:0 0 22px;
  }
  .contacts{
    display:flex;
    flex-direction:column;
    gap:14px;
    text-align:left;
    margin-bottom:28px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--ink);
    text-decoration:none;
    font-size:14.5px;
    border-radius:8px;
    padding:4px 2px;
    transition:color .15s ease;
  }
  a.row:hover{color:var(--accent);}
  .row .ic{
    width:20px;
    height:20px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--accent);
  }
  .row .ic svg{width:17px;height:17px;}
  .row span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .save-btn{
    display:block;
    width:100%;
    background:var(--accent);
    color:#1A1206;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    cursor:pointer;
    transition:filter .15s ease, transform .15s ease;
  }
  .save-btn:hover{filter:brightness(1.08);}
  .save-btn:active{transform:scale(0.98);}
  .save-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .cv-btn{
    display:block;
    width:100%;
    background:transparent;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:1px solid var(--edge);
    border-radius:10px;
    padding:12px 16px;
    margin-top:10px;
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }
  .cv-btn:hover{border-color:var(--accent); color:var(--accent);}
  .cv-btn:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  a.row:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>

<script>
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  const glyphs = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
  const fontSize = 15;
  let columns, drops;

  function setup(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -40));
  }
  setup();
  window.addEventListener('resize', setup);

  function frame(){
    ctx.fillStyle = 'rgba(14,21,32,0.09)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    ctx.fillStyle = '#3ddc7a';
    for(let i = 0; i < drops.length; i++){
      const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
      ctx.fillText(glyph, i * fontSize, drops[i] * fontSize);
      if(drops[i] * fontSize > canvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){
    ctx.fillStyle = '#0E1520';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    setInterval(frame, 45);
  }
})();

function saveContact(){
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:ARI;Samet;;;",
    "FN:Samet ARI",
    "TITLE:Cybersecurity & Systems/Network Admin",
    "EMAIL;TYPE=INTERNET:samet.ari@laplateforme.io",
    "TEL;TYPE=CELL:+33758211154",
    "URL:https://www.linkedin.com/in/samet-ari/",
    "URL:https://github.com/samet-ari",
    "ADR;TYPE=WORK:;;;Aix-en-Provence;;;France",
    "END:VCARD"
  ].join("\r\n");
  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Samet_ARI.vcf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
